<!-- Adapted from the MDN Drawing polymarkers example.
     https://developer.mozilla.org/en-US/docs/Web/SVG/Reference/Element/marker#drawing_polymarkers
     Only explicit output dimensions were added; geometry and styles are unchanged. -->
<svg width="300" height="300" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="5" fill="red" />
    </marker>
  </defs>
  <polyline points="10,10 10,90 90,90" fill="none" stroke="black"
            marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <polyline points="15,80 29,50 43,60 57,30 71,40 85,15"
            fill="none" stroke="grey" marker-start="url(#dot)"
            marker-mid="url(#dot)" marker-end="url(#dot)" />
</svg>

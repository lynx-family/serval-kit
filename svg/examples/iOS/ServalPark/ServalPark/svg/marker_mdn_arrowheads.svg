<!-- Adapted from the MDN Drawing arrowheads example.
     https://developer.mozilla.org/en-US/docs/Web/SVG/Reference/Element/marker#drawing_arrowheads
     Only explicit output dimensions were added; geometry and styles are unchanged. -->
<svg width="900" height="300" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <line x1="10" y1="10" x2="90" y2="90" stroke="black"
        marker-end="url(#arrow)" />
  <path d="M 110 10
           C 120 20, 130 20, 140 10
           C 150 0, 160 0, 170 10
           C 180 20, 190 20, 200 10"
        stroke="black" fill="none" marker-start="url(#arrow)"
        marker-mid="url(#arrow)" marker-end="url(#arrow)" />
</svg>

name: Build Markdown and Run Unit Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "markdown/**"
      - ".github/workflows/markdown-ci.yml"

jobs:
  run-markdown-tests:
    name: Run Markdown Unit Tests
    runs-on: lynx-darwin-15.6.1-medium
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sync Common Dependencies
        uses: ./.github/actions/sync-deps
        with:
          target: testing

      - name: Build and Run Tests
        run: |
          source tools/envsetup.sh
          git lfs pull
          cmake -S markdown -B markdown/build
          cmake --build markdown/build -j --target markdown_tests
          ./markdown/build/testing/markdown/markdown_tests

  build-android:
    name: Build Android
    runs-on: lynx-ubuntu-22.04-large
    steps:
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java SDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 11
          distribution: "zulu"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: 9862592
          packages: "platform-tools"

      - name: Install CMake
        run: echo "y" | sdkmanager --install "cmake;3.18.1"

      - name: Sync Common Dependencies
        uses: ./.github/actions/sync-deps

      - name: Build Demo
        working-directory: markdown/example/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

  build-ios:
    name: Build iOS
    runs-on: lynx-darwin-15.6.1-medium
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    timeout-minutes: 30
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Sync Common Dependencies
        uses: ./.github/actions/sync-deps

      - name: Build Demo
        run: |
          source tools/envsetup.sh
          pushd markdown/example/ios/ServalMarkdownDemo
          bundle install
          bundle exec pod install
          xcodebuild -workspace ServalMarkdownDemo.xcworkspace -scheme ServalMarkdownDemo -configuration Release -arch arm64 -sdk iphoneos SYMROOT=$(pwd)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  build-harmony:
    name: Build HarmonyOS
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:bf493c3710de3c44bfa84caf402c0727b9310c42497f6e52580ad441ea640ef1
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync Common Dependencies
        uses: ./.github/actions/sync-deps

      - name: Install dependencies and Build
        shell: bash
        run: |
          source tools/envsetup.sh
          pushd markdown/example/harmony
          ohpm install
          hvigorw assembleApp --mode project -p product=default -p buildMode=debug --no-daemon

name: Sheet
on:
  push:
    paths: ['sheet/**', 'ServalSheet*.podspec', '.github/workflows/sheet-ci.yml']
  pull_request:
    paths: ['sheet/**', 'ServalSheet*.podspec', '.github/workflows/sheet-ci.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: ./gradlew :serval_sheet:testDebugUnitTest :serval_sheet:assembleRelease :serval_sheet_lynx:assembleRelease :sheet_binding_test:assembleDebug
        working-directory: sheet/platform/android
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install project generator
        run: |
          gem install --user-install rexml --version 3.3.8 --no-document
          gem install --user-install xcodeproj --version 1.27.0 --no-document
      - run: ruby -e 'gem "rexml", "3.3.8"; load "sheet/testing/ios/generate.rb"'
      - name: Select simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "SHEET_SIMULATOR=$DEVICE_ID" >> "$GITHUB_ENV"
      - run: xcodebuild test -project sheet/build/ios-tests/SheetTests.xcodeproj -scheme SheetTests -destination "platform=iOS Simulator,id=$SHEET_SIMULATOR" CODE_SIGNING_ALLOWED=NO
